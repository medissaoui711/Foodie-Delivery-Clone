name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend to Pages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [customer, restaurant, driver, admin]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy ${{ matrix.app }} app
        working-directory: ./frontend/${{ matrix.app }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages deploy . \
            --project-name=foodie-${{ matrix.app }} \
            --branch=main

  # Note: Backend (Go) cannot be deployed to Cloudflare Workers
  # Deploy backend to Railway, Render, or Fly.io instead
  # See DEPLOYMENT.md for instructions

  deploy-notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: deploy-frontend

    steps:
      - name: Deployment Summary
        run: |
          echo "✅ Frontend deployed successfully!"
          echo ""
          echo "🌐 Frontend URLs:"
          echo "  - Customer: https://foodie-customer.pages.dev"
          echo "  - Restaurant: https://foodie-restaurant.pages.dev"
          echo "  - Driver: https://foodie-driver.pages.dev"
          echo "  - Admin: https://foodie-admin.pages.dev"
          echo ""
          echo "⚠️ Note: Backend must be deployed separately to Railway, Render, or Fly.io"
