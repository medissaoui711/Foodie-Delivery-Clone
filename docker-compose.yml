version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: deliveroo_postgres
    restart: always
    environment:
      POSTGRES_DB: deliveroo
      POSTGRES_USER: deliveroo_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecurePass2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deliveroo_user -d deliveroo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: deliveroo_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-RedisPass2026!} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-RedisPass2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deliveroo_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://deliveroo_user:${POSTGRES_PASSWORD:-SecurePass2026!}@postgres:5432/deliveroo?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-RedisPass2026!}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-SuperSecretJWTKey2026ChangeMe!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-SuperSecretRefreshKey2026!}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
    ports:
      - "8080:8080"

  nginx:
    image: nginx:alpine
    container_name: deliveroo_nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/customer:/usr/share/nginx/html/customer:ro
      - ./frontend/restaurant:/usr/share/nginx/html/restaurant:ro
      - ./frontend/driver:/usr/share/nginx/html/driver:ro
      - ./frontend/admin:/usr/share/nginx/html/admin:ro
      - nginx_logs:/var/log/nginx

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
