# Render.com Deployment Configuration
# Deploy your Go backend to Render (free tier available)
# Website: https://render.com

services:
  # Backend API Service
  - type: web
    name: foodie-api
    env: go
    plan: free  # or starter, standard, etc.
    buildCommand: cd backend && go build -o server ./cmd/server
    startCommand: ./backend/server
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: foodie-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: foodie-redis
          property: connectionString

  # PostgreSQL Database
  - type: pserv
    name: foodie-postgres
    plan: free  # or starter, standard, etc.
    ipAllowList: []

  # Redis Cache
  - type: redis
    name: foodie-redis
    plan: free  # or starter, standard, etc.
    ipAllowList: []

# Note: For production, consider upgrading from free tier
# Free tier limitations:
# - Web services: 512 MB RAM, sleeps after 15 min idle
# - Databases: 90 days retention, limited storage
