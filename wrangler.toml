# Cloudflare Pages Configuration
# This file configures Cloudflare Pages for static frontend hosting
# Backend API should be deployed separately (see DEPLOYMENT.md)

# Note: Each frontend app is deployed separately as its own Pages project
# Use wrangler CLI or GitHub Actions for deployment

# Example deployment commands:
# cd frontend/customer && wrangler pages deploy . --project-name=foodie-customer
# cd frontend/restaurant && wrangler pages deploy . --project-name=foodie-restaurant
# cd frontend/driver && wrangler pages deploy . --project-name=foodie-driver
# cd frontend/admin && wrangler pages deploy . --project-name=foodie-admin
